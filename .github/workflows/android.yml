name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -q ChannelMP3.zip

      - name: Install Android SDK 35 if needed
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35"
          fi

      - name: Compile APK
        working-directory: ChannelMP3
        run: |
          sed -i 's/youtubedl-android:library:0\.16\.0/youtubedl-android:library:0.17.1/g; s/youtubedl-android:ffmpeg:0\.16\.0/youtubedl-android:ffmpeg:0.17.1/g' app/build.gradle

          src=app/src/main/java/com/channelmp3/MainActivity.kt
          sed -i 's/textIsSelectable = true/setTextIsSelectable(true)/' "$src"
          sed -i '/engine.init(applicationContext)/a\        report("Mise à jour de yt-dlp…")\n        engine.updateYoutubeDL(applicationContext, YoutubeDL.UpdateChannel.STABLE)' "$src"

          bash gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChannelMP3-APK
          path: ChannelMP3/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
